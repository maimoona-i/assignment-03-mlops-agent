name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # Only light dependencies: MLflow / Kubernetes / Airflow / Anthropic calls are MOCKED in tests.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Unit tests (pytest)
        run: pytest

      - name: Validate Kubernetes manifests (YAML syntax)
        run: python -c "import yaml,glob; [list(yaml.safe_load_all(open(f))) for f in glob.glob('kubernetes/*.yaml')]; print('manifests OK')"
