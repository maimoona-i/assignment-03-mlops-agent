[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mlops-agent"
version = "1.0.0"
description = "Assignment 03: production-ready MLOps AI agent (DVC, MLflow, Airflow, Kubernetes)"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pydantic>=2.6",
  "httpx>=0.27",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
# Real integrations (imported lazily, so CI does not need them)
mlops = [
  "mlflow==2.22.0",
  "kubernetes>=29.0",
  "anthropic>=0.40",
  "dvc>=3.50",
]
# Training / inference
train = ["scikit-learn>=1.4", "pandas>=2.0", "numpy>=1.26", "joblib>=1.3"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[tool.setuptools.packages.find]
include = ["agent*", "api*", "training*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "B"]
ignore = ["E501", "E741", "B008"]
