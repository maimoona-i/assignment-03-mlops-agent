apiVersion: v1
kind: ConfigMap
metadata:
  name: ml-inference-config
  namespace: mlops-agent
  labels:
    app: ml-inference
data:
  # Non-sensitive configuration only (no secrets here)
  APP_VERSION: "1.0.0"
  MODEL_PATH: "/app/models/model.joblib"
  MODEL_RUN_ID: "REPLACE_WITH_MLFLOW_RUN_ID"      # set to the MLflow run id of the model baked into the image
  DATASET_VERSION: "v1"
  LOG_LEVEL: "INFO"
