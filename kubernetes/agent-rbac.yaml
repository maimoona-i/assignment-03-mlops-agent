# Least-privilege identity for the agent: it can only read/patch what it needs, ONLY in the mlops-agent namespace.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mlops-agent
  namespace: mlops-agent
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mlops-agent-role
  namespace: mlops-agent
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "services", "endpoints", "events", "configmaps"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["patch"]
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mlops-agent-binding
  namespace: mlops-agent
subjects:
  - kind: ServiceAccount
    name: mlops-agent
    namespace: mlops-agent
roleRef:
  kind: Role
  name: mlops-agent-role
  apiGroup: rbac.authorization.k8s.io
