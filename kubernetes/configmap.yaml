apiVersion: v1
kind: ConfigMap
metadata:
  name: ml-inference-config
  namespace: mlops-agent
  labels:
    app: ml-inference
data:
  # Non-sensitive configuration only (no secrets here)
  APP_VERSION: "1.0.0"
  MODEL_PATH: "/app/models/model.joblib"
  MODEL_RUN_ID: "149c9a5cfb944b0b8be8908eb1167c1b"      # set to the MLflow run id of the model baked into the image
  DATASET_VERSION: "v2"
  LOG_LEVEL: "INFO"
