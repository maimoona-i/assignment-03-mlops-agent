apiVersion: apps/v1
kind: Deployment
metadata:
  name: ml-inference-api
  namespace: mlops-agent
  labels:
    app: ml-inference
    app.kubernetes.io/version: "1.0.0"
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app: ml-inference
  template:
    metadata:
      labels:
        app: ml-inference
        app.kubernetes.io/version: "1.0.0"
    spec:
      containers:
        - name: api
          image: mlops-inference:1.0.0
          imagePullPolicy: IfNotPresent      # image is loaded into minikube/kind locally
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: ml-inference-config
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
