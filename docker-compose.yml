# Local MLflow tracking server + Apache Airflow 3 (standalone mode, DEV ONLY - credentials are dev defaults).
#   docker compose up -d --build
#   MLflow UI: http://localhost:5000     Airflow UI/API: http://localhost:8080   (admin / admin)
services:
  mlflow:
    build:
      context: .
      dockerfile: docker/Dockerfile.mlflow
    ports:
      - "5000:5000"
    volumes:
      - ./mlflow-data:/mlflow

  airflow:
    build:
      context: .
      dockerfile: docker/Dockerfile.airflow
    command: standalone
    depends_on:
      - mlflow
    ports:
      - "8080:8080"
    environment:
      PROJECT_DIR: /opt/airflow/project
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_EXPERIMENT: mlops-agent-demo
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/project/dags
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "False"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: "admin:admin"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/simple_auth_passwords.json
    volumes:
      - .:/opt/airflow/project
      - ./airflow/simple_auth_passwords.json:/opt/airflow/simple_auth_passwords.json
      - ./airflow-logs:/opt/airflow/logs
    user: "${AIRFLOW_UID:-50000}:0"
